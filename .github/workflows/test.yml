name: Reinforcement-learning tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt

      - name: Check Python syntax
        run: python -m compileall -q GameExperience.py TreasureMaze.py dqn_training.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
